<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spell Sandbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#070d24;--panel:#0b1433e8;--panel2:#111c44;--line:#22305e;--line2:#34477a;--txt:#f2f5ff;--mute:#8d9bc4;
  --cyan:#19e6ff;--violet:#9d7bff;--orange:#ff8a1f;--pink:#ff3fb4;--mana:#38c6ff;--ok:#4dffb0;
  --bsz:min(calc(100vh - 210px),calc(100vw - 820px),780px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--navy);color:var(--txt);font:14px/1.4 Rubik,"Segoe UI",system-ui,sans-serif;overflow-x:hidden}
#bgimg{position:fixed;inset:-20px;background:#0b1433 center/cover no-repeat;transition:background-image .4s;z-index:-2;filter:saturate(1.05)}
#bgshade{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at center,#07112a33 0,#07112a99 60%,#050a1ee6 100%)}
button{font:inherit;color:inherit;cursor:pointer}
/* ---- top bar ---- */
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 24px;background:linear-gradient(#060c22,#0a1430f2);border-bottom:1px solid var(--line)}
.lbl{font-weight:800;letter-spacing:4px;color:var(--cyan);font-size:13px}
.sub{font-weight:500;letter-spacing:.5px;font-size:13px;opacity:.9;margin:2px 0 6px}
.switch{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:#0006}
.switch button{border:0;background:none;padding:6px 14px;font-weight:800;font-size:11px;letter-spacing:2px;color:var(--mute)}
.switch button.on{background:linear-gradient(90deg,#16b8d8,#19e6ff);color:#04122a}
.logo{height:30px;filter:drop-shadow(0 0 12px #ff8a1f55)}
.tr{display:flex;justify-content:flex-end;gap:10px}
.btn{border-radius:10px;padding:10px 22px;font-weight:800;letter-spacing:1px;font-size:13px;border:1px solid transparent;transition:transform .12s,box-shadow .2s,filter .2s;text-transform:uppercase}
.btn:hover{transform:translateY(-1px);filter:brightness(1.1)}
.btn:active{transform:translateY(1px)}
.btn.orange{background:linear-gradient(180deg,#ff9b35,#ff7a0f);box-shadow:0 4px 0 #b9500a,0 8px 20px #ff7a0f55;color:#fff}
.btn.violet{background:linear-gradient(90deg,#7c5cff,#a98bff);box-shadow:0 8px 24px #7c5cff55;color:#fff}
.btn.ghost{background:#0b1433cc;border-color:#cfe3ff;color:#fff}
/* ---- layout ---- */
.stage{display:grid;grid-template-columns:320px auto 340px;gap:28px;justify-content:center;align-items:start;padding:22px 24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 30px #0007;backdrop-filter:blur(8px)}
.card+.card{margin-top:14px}
.cardHead{text-align:center;font-weight:800;letter-spacing:3px;font-size:13px;padding:12px;border-bottom:1px solid var(--line);background:#0a1230}
.cardBody{padding:12px}
.label{font-size:11px;font-weight:800;letter-spacing:3px;color:var(--cyan);text-transform:uppercase}
.mute{color:var(--mute)}
/* spell card (left) */
.spellcard{padding:16px;display:flex;gap:14px;align-items:flex-start;min-height:118px;background:linear-gradient(135deg,#1a2350f0,#0b1433f0);border-color:#3b4a80}
.spellcard .ico{position:relative;width:78px;height:78px;flex:none;border-radius:6px;background:#0005 center/cover;border:2px solid #ffffff33;box-shadow:0 0 0 3px #0006}
.spellcard h2{margin:2px 0 4px;font-size:21px;font-weight:800}
.spellcard p{margin:0;font-size:13px;color:#d8def5}
.step{margin-top:10px;font-weight:800;font-size:12px;letter-spacing:1.5px;color:var(--cyan);text-transform:uppercase}
.step .x{color:var(--mute);font-weight:500;letter-spacing:0;text-transform:none;font-size:13px;display:block;margin-top:3px}
.sc-actions{display:flex;gap:8px;margin-top:10px}
.sbtn{background:#ffffff14;border:1px solid #ffffff30;border-radius:8px;padding:6px 12px;font-weight:700;font-size:12px;letter-spacing:1px}
.sbtn:hover{border-color:var(--cyan)}
.sbtn.go{background:linear-gradient(90deg,#7c5cff,#a98bff);border:0}
.diamond{position:absolute;top:-10px;right:-10px;width:26px;height:26px;display:grid;place-items:center}
.diamond::before{content:"";position:absolute;inset:3px;transform:rotate(45deg);background:linear-gradient(135deg,#7fe3ff,#1f9dff);border:2px solid #fff;border-radius:4px;box-shadow:0 2px 6px #0008}
.diamond b{position:relative;font-size:12px;font-weight:900;color:#fff;text-shadow:0 1px 2px #0369}
/* mana */
.manaRow{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line)}
.manaRow:last-child{border:0}
.manaRow.turn{background:linear-gradient(90deg,#19e6ff22,transparent)}
.who{display:flex;align-items:center;gap:8px;font-weight:700}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid #fff9;display:inline-block}
.dot.w{background:#fff}.dot.b{background:#111a33}
.mval{display:flex;align-items:center;gap:6px}
.mval .diamond{position:relative;top:0;right:0;width:30px;height:30px}
.mval .diamond b{font-size:13px}
.pm{width:26px;height:26px;border-radius:6px;border:1px solid var(--line2);background:#0005;font-weight:800}
.pm:hover{border-color:var(--cyan)}
/* palette */
#palette{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pp{aspect-ratio:1;border-radius:6px;border:2px solid var(--line);background:#0006;display:grid;place-items:center;cursor:pointer;transition:.12s}
.pp img{width:88%;height:88%;object-fit:contain}
.pp:hover{border-color:var(--line2);transform:translateY(-2px)}
.pp.on{border-color:var(--cyan);box-shadow:0 0 12px #19e6ff88;background:#19e6ff22}
.pp.erase{font-size:20px;color:#ff6b6b;grid-column:span 2;aspect-ratio:auto;font-weight:800;font-size:12px;letter-spacing:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select{background:#0a1230;color:var(--txt);border:1px solid var(--line2);border-radius:6px;padding:5px 8px;font:inherit;font-size:12px}
/* ---- board ---- */
.center{display:flex;flex-direction:column;align-items:center}
.tomove{width:calc(var(--bsz) + 40px);background:#060b1fd9;border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;text-align:center;padding:9px;font-weight:800;font-size:13px;letter-spacing:1.5px;display:flex;justify-content:center;align-items:center;gap:8px}
.frame{position:relative;padding:20px;background:#5c7392;border:4px solid #e9f0fb;border-radius:2px;box-shadow:0 20px 60px #000a}
.frame.dark{border-color:#34477a;background:#0b1433;box-shadow:0 20px 60px #000a,0 0 0 1px #34477a inset}
body:not(.coords-on) .coords{display:none}
.coords{position:absolute;display:flex;font-size:10px;font-weight:700;color:#5c7392;pointer-events:none}
.frame.dark .coords{color:#8d9bc4}
.coords.h{left:20px;right:20px;height:20px;align-items:center}.coords.h.t{top:0}.coords.h.b{bottom:0}
.coords.v{top:20px;bottom:20px;width:20px;flex-direction:column;justify-content:space-around;align-items:center}.coords.v.l{left:0}.coords.v.r{right:0}
.coords.h span{flex:1;text-align:center}
.boardIn{position:relative;width:var(--bsz);height:var(--bsz);outline:3px solid #e9f0fb;background:center/100% 100% no-repeat}
#board{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr))}
.sq{position:relative;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
.sq:hover::before{content:"";position:absolute;inset:0;background:#ffffff1a}
.sq.last::before{content:"";position:absolute;inset:0;background:#ffd84a55}
.sq.sel::before{content:"";position:absolute;inset:0;background:#ffd84a99;box-shadow:inset 0 0 0 3px #ffd84a}
.sq.tgt::after{content:"";position:absolute;width:28%;height:28%;border-radius:50%;background:#0b143399;box-shadow:0 0 0 2px #fff6}
.sq.tgt.cap::after{width:84%;height:84%;background:none;border:5px solid #ff3fb4bb;box-shadow:none}
.sq.spt::after{content:"";position:absolute;inset:6%;border-radius:8px;border:3px solid var(--cyan);background:#19e6ff2a;box-shadow:0 0 14px #19e6ffaa inset,0 0 10px #19e6ff88;animation:pulse 1s infinite}
.sq.pick::before{content:"";position:absolute;inset:0;background:#19e6ff66}
.pc{position:absolute;inset:16%;width:68%;height:68%;object-fit:contain;z-index:2;pointer-events:none;transition:transform .12s}
.sq:hover .pc{transform:translateY(-3px)}
.pc.hid{opacity:.35;filter:grayscale(1)}
.pc.stun{filter:saturate(.4)}
.tag{position:absolute;left:4%;bottom:4%;font-size:calc(var(--bsz)/72);font-weight:800;z-index:3;background:#000c;color:#fff;border-radius:4px;padding:1px 5px;letter-spacing:1px}
.bm{position:absolute;right:4%;top:2%;z-index:3;font-size:calc(var(--bsz)/40);color:#ffb03f;font-weight:800}
#fx{position:absolute;inset:-25%;width:150%;height:150%;pointer-events:none;z-index:5}
#pop{position:absolute;z-index:7;pointer-events:none;font-weight:900;font-size:calc(var(--bsz)/22);color:#fff;-webkit-text-stroke:1.5px #0b1433;text-shadow:0 0 18px var(--pink),0 3px 0 #0b1433;opacity:0;white-space:nowrap;letter-spacing:1px}
#cast{position:absolute;left:50%;top:50%;width:34%;aspect-ratio:1;z-index:8;pointer-events:none;opacity:0;border-radius:10px;background:center/cover;box-shadow:0 0 0 4px #fff,0 0 60px 10px var(--cyan)}
#castName{position:absolute;left:0;right:0;top:66%;text-align:center;z-index:8;pointer-events:none;font-weight:900;font-size:calc(var(--bsz)/14);color:#fff;-webkit-text-stroke:2px #0b1433;text-shadow:0 0 24px var(--cyan),0 4px 0 #0b1433;opacity:0;letter-spacing:2px;text-transform:uppercase}
#flash{position:absolute;inset:0;z-index:9;pointer-events:none;opacity:0}
#win{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:10;background:#050a1ecc;font-weight:900}
#win .t{font-size:calc(var(--bsz)/9);text-shadow:0 0 30px var(--orange)}
#win .label{margin-bottom:8px}
.toolbar{display:flex;margin-top:14px;background:#060b1fe6;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.toolbar button{background:none;border:0;border-right:1px solid var(--line);padding:12px 20px;font-weight:800;font-size:12px;letter-spacing:1.5px;display:flex;gap:7px;align-items:center;transition:background .15s}
.toolbar button:last-child{border:0}
.toolbar button:hover{background:#ffffff10}
.toolbar button.cy{color:var(--cyan)}
/* ---- spells grid ---- */
#spells{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 10px;padding:16px 14px 10px;max-height:calc(var(--bsz) - 190px);overflow:auto}
.tile{position:relative;background:none;border:0;padding:0;text-align:center}
.tile .im{position:relative;aspect-ratio:1;border-radius:5px;background:#0006 center/cover;border:2px solid #ffffff2a;box-shadow:0 0 0 2px #0008;transition:transform .14s,box-shadow .2s}
.tile:hover .im{transform:translateY(-3px) scale(1.04);box-shadow:0 0 0 2px var(--cyan),0 8px 20px #19e6ff44}
.tile.act .im{box-shadow:0 0 0 3px var(--cyan),0 0 22px var(--cyan)}
.tile.dis{opacity:.35;filter:grayscale(.7)}
.tile .nm{display:block;font-size:10px;font-weight:700;margin-top:5px;line-height:1.15;color:#c9d3f2}
.tile .diamond{top:-8px;right:-8px;width:24px;height:24px}
.tile .diamond b{font-size:11px}
.cardFoot{display:flex;justify-content:space-between;align-items:center;padding:8px 14px 12px;font-size:12px}
.cardFoot a{color:var(--violet);font-weight:800;letter-spacing:1px;cursor:pointer}
/* cosmetics */
.cos-prev{display:flex;justify-content:center;padding:14px}
.cos-prev .bp{position:relative;width:130px;height:130px;background:center/cover;border:3px solid #e9f0fb;box-shadow:0 6px 20px #000a}
.cos-prev .bp img{position:absolute;width:40%;bottom:6%;left:8%;filter:drop-shadow(0 2px 2px #0008)}
.cos-prev .bp img+img{left:auto;right:8%;bottom:auto;top:6%}
.cosRow{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer;font-size:13px;transition:background .15s}
.cosRow:hover{background:#ffffff0c}
.cosRow .v{display:flex;align-items:center;gap:8px;font-weight:800}
.cosRow .v img{width:20px;height:20px;border-radius:3px;object-fit:cover}
.cosRow .v::after{content:"›";font-size:18px;color:var(--mute)}
/* settings */
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;padding:12px 14px;font-size:12px;font-weight:600}
.tg{display:flex;align-items:center;gap:8px;cursor:pointer}
.tg input{display:none}
.tg i{width:30px;height:16px;border-radius:10px;background:#ffffff22;position:relative;transition:.2s;flex:none}
.tg i::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:.2s}
.tg input:checked+i{background:var(--cyan)}
.tg input:checked+i::after{left:16px}
#log{max-height:120px;overflow:auto;font-size:12px;color:var(--mute);padding:8px 14px}
#log div{padding:3px 0;border-bottom:1px solid #ffffff0a}
/* modal */
#modal{position:fixed;inset:0;background:#030716cc;z-index:50;display:none;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
#modal.show{display:flex}
.mbox{width:min(920px,94vw);max-height:86vh;display:flex;flex-direction:column}
.mtabs{display:flex;gap:6px;padding:12px 14px;border-bottom:1px solid var(--line)}
.mtabs button{background:none;border:1px solid var(--line2);border-radius:6px;padding:7px 14px;font-weight:800;font-size:12px;letter-spacing:1.5px}
.mtabs button.on{background:var(--cyan);color:#04122a;border-color:var(--cyan)}
.mtabs .sp{flex:1}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:14px;overflow:auto}
.skin{background:#0a1230;border:2px solid var(--line);border-radius:6px;padding:8px;text-align:left;transition:.15s}
.skin:hover{border-color:var(--line2);transform:translateY(-2px)}
.skin.on{border-color:var(--cyan);box-shadow:0 0 16px #19e6ff66}
.skin .th{aspect-ratio:1;background:center/cover;border-radius:3px;position:relative}
.skin .th img{position:absolute;width:46%;left:27%;bottom:6%;filter:drop-shadow(0 3px 3px #000a)}
.skin .th.pcs{background:#111c44;display:flex;align-items:flex-end;justify-content:center}
.skin .th.pcs img{position:static;width:48%}
.skin b{display:block;margin-top:6px;font-size:13px}
/* focus mode (recording) */
body.focus .top,body.focus aside,body.focus .toolbar{display:none}
body.focus{--bsz:min(calc(100vh - 110px),calc(100vw - 80px))}
body.focus .stage{grid-template-columns:auto;padding-top:24px}
#focusHint{position:fixed;right:14px;bottom:12px;font-size:11px;color:#fff8;display:none}
body.focus #focusHint{display:block}
@keyframes pulse{50%{opacity:.5}}
@media (max-width:1300px){:root{--bsz:min(calc(100vw - 500px),calc(100vh - 210px))}.stage{grid-template-columns:auto 340px}aside.left{grid-column:2;grid-row:1}aside.right{grid-column:2}.stage{grid-auto-flow:row dense}}
@media (max-width:900px){:root{--bsz:calc(100vw - 72px)}.stage{grid-template-columns:1fr}aside.left,aside.right{grid-column:auto;grid-row:auto}#spells{max-height:none}.top{grid-template-columns:1fr auto}.top .logo{display:none}}
</style>
</head>
<body>
<div id="bgimg"></div><div id="bgshade"></div>
<header class="top">
  <div>
    <div class="lbl">SANDBOX</div>
    <div class="sub">Spell preview board</div>
    <div class="switch" id="modeSw"><button data-mode="play" class="on">PLAY</button><button data-mode="create">CREATIVE</button></div>
  </div>
  <img class="logo" src="skins/logo.png" alt="Anichess">
  <div class="tr">
    <button class="btn ghost" id="focusBtn" title="Hide panels for recording (H)">Record view</button>
    <button class="btn orange" id="reset">New game</button>
  </div>
</header>
<main class="stage">
  <aside class="left">
    <div class="card spellcard" id="spellCard"></div>
    <div class="card" id="createPanel" style="display:none">
      <div class="cardHead">PLACE PIECES</div>
      <div class="cardBody">
        <div id="palette"></div>
        <div class="row" style="margin-top:12px">
          <button class="sbtn" id="clear">CLEAR BOARD</button>
          <button class="sbtn" id="startPos">START POSITION</button>
        </div>
        <div class="mute" style="font-size:12px;margin-top:10px">Pick a piece, click squares. Right-click erases. No piece picked: click a piece, then any square to move it.</div>
      </div>
    </div>
    <div class="card">
      <div class="cardHead">MANA</div>
      <div class="manaRow" id="mw"><span class="who"><span class="dot w"></span>White</span><span class="mval"><button class="pm" data-m="w-">−</button><span class="diamond"><b id="manaw">0</b></span><button class="pm" data-m="w+">+</button></span></div>
      <div class="manaRow" id="mb"><span class="who"><span class="dot b"></span>Black</span><span class="mval"><button class="pm" data-m="b-">−</button><span class="diamond"><b id="manab">0</b></span><button class="pm" data-m="b+">+</button></span></div>
    </div>
    <div class="card"><div class="cardHead">LOG</div><div id="log"></div></div>
  </aside>
  <section class="center">
    <div class="tomove" id="toMove"></div>
    <div class="frame" id="frame">
      <div class="coords h t"></div><div class="coords h b"></div><div class="coords v l"></div><div class="coords v r"></div>
      <div class="boardIn" id="boardIn">
        <div id="board"></div>
        <canvas id="fx"></canvas>
        <div id="cast"></div><div id="castName"></div>
        <div id="pop"></div>
        <div id="flash"></div>
        <div id="win"><div class="label">GAME OVER</div><div class="t"></div></div>
      </div>
    </div>
    <div class="toolbar">
      <button id="undo">↶ UNDO</button>
      <button id="flip">⇅ FLIP</button>
      <button id="pass">⏭ PASS TURN</button>
      <button id="cancelBtn" class="cy">✕ CANCEL SPELL</button>
    </div>
  </section>
  <aside class="right">
    <div class="card">
      <div class="cardHead">SPELLS</div>
      <div id="spells"></div>
      <div class="cardFoot"><span class="mute">Chaos Summon: <select id="chaosForce"><option value="rand">Random</option><option value="r">Rook</option><option value="b">Bishop</option><option value="n">Knight</option><option value="p">Pawn</option><option value="-">Nothing</option></select></span></div>
    </div>
    <div class="card">
      <div class="cardHead">COSMETICS</div>
      <div class="cos-prev"><div class="bp" id="cosPrev"></div></div>
      <div class="cosRow" data-tab="board"><span class="mute">Board</span><span class="v" id="cvBoard"></span></div>
      <div class="cosRow" data-tab="pieces"><span class="mute">Pieces</span><span class="v" id="cvPieces"></span></div>
      <div class="cosRow" data-tab="bg"><span class="mute">Background</span><span class="v" id="cvBg"></span></div>
    </div>
    <div class="card">
      <div class="cardHead">SETTINGS</div>
      <div class="toggles">
        <label class="tg"><input type="checkbox" id="infMana" checked><i></i>Infinite mana</label>
        <label class="tg"><input type="checkbox" id="freeTurn"><i></i>Ignore turns</label>
        <label class="tg"><input type="checkbox" id="sound" checked><i></i>Sound</label>
        <input type="checkbox" id="showBanner" hidden><label class="tg"><input type="checkbox" id="coordsT"><i></i>Coordinates</label>
      </div>
    </div>
  </aside>
</main>
<div id="modal"><div class="card mbox">
  <div class="mtabs"><button data-tab="board">BOARD</button><button data-tab="pieces">PIECES</button><button data-tab="bg">BACKGROUND</button><span class="sp"></span><button id="mAll">USE FULL SET</button><button id="mClose">✕</button></div>
  <div class="mgrid" id="mgrid"></div>
</div></div>
<div id="focusHint">Press H to show panels</div>
<script>
"use strict";
const GLYPH={k:"♚",q:"♛",r:"♜",b:"♝",n:"♞",p:"♟"};
const VAL={p:1,n:3,b:3,r:5,q:9,k:100};
const NAME={p:"Pawn",n:"Knight",b:"Bishop",r:"Rook",q:"Queen",k:"King"};
const FILES="abcdefgh";
const $=id=>document.getElementById(id);
const sqName=(r,c)=>FILES[c]+(8-r);
const inB=(r,c)=>r>=0&&r<8&&c>=0&&c<8;
const opp=c=>c==="w"?"b":"w";
let uid=1;
const mk=(t,c)=>({t,c,id:uid++,moved:false,hid:0,stun:0});

let ANIM=[],busy=false;
let S, hist=[], mode="play", flipped=false, sel=null, targets=[], lastMove=[], spell=null, spellSel=[], palettePick=null;

function startBoard(){
  const b=Array.from({length:8},()=>Array(8).fill(null));
  const back="rnbqkbnr";
  for(let c=0;c<8;c++){b[0][c]=mk(back[c],"b");b[1][c]=mk("p","b");b[6][c]=mk("p","w");b[7][c]=mk(back[c],"w");}
  return b;
}
function newState(board){return{board:board||startBoard(),turn:"w",ep:null,mana:{w:5,b:5},bombs:[],skip:{w:false,b:false},piCost:{w:8,b:8},winner:null,log:[]};}
const clone=o=>JSON.parse(JSON.stringify(o));
function save(){hist.push(clone({S,lastMove}));if(hist.length>200)hist.shift();}
function undo(){if(!hist.length)return;const h=hist.pop();S=h.S;lastMove=h.lastMove;cancel();render();}
const at=(r,c)=>inB(r,c)?S.board[r][c]:null;
function log(t){S.log.push(t);}

/* ---------- normal moves (Anichess: no check rule, capture the king) ---------- */
function rays(r,c,dirs,slide,col,opt={}){
  const out=[];
  for(const[dr,dc]of dirs){
    let rr=r+dr,cc=c+dc;
    while(inB(rr,cc)){
      const p=S.board[rr][cc];
      if(!p){out.push([rr,cc]);}
      else{if(p.c!==col&&!(opt.noKing&&p.t==="k"))out.push([rr,cc]);break;}
      if(!slide)break;rr+=dr;cc+=dc;
    }
  }
  return out;
}
const D_R=[[1,0],[-1,0],[0,1],[0,-1]],D_B=[[1,1],[1,-1],[-1,1],[-1,-1]],D_Q=D_R.concat(D_B);
const D_N=[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]];
function moves(r,c){
  const p=S.board[r][c];if(!p||p.stun)return[];
  const col=p.c;
  switch(p.t){
    case"n":return rays(r,c,D_N,false,col);
    case"b":return rays(r,c,D_B,true,col);
    case"r":return rays(r,c,D_R,true,col);
    case"q":return rays(r,c,D_Q,true,col);
    case"k":{
      const m=rays(r,c,D_Q,false,col);
      if(!p.moved){
        for(const[rc,step,between]of[[7,1,[5,6]],[0,-1,[1,2,3]]]){
          const rk=at(r,rc);
          if(rk&&rk.t==="r"&&rk.c===col&&!rk.moved&&between.every(x=>!S.board[r][x]))m.push([r,c+2*step,"castle"]);
        }
      }
      return m;
    }
    case"p":{
      const d=col==="w"?-1:1,m=[];
      if(inB(r+d,c)&&!S.board[r+d][c]){m.push([r+d,c]);
        const sr=col==="w"?6:1;if(r===sr&&!S.board[r+2*d][c])m.push([r+2*d,c]);}
      for(const dc of[-1,1]){const rr=r+d,cc=c+dc;if(!inB(rr,cc))continue;
        const t=S.board[rr][cc];if(t&&t.c!==col)m.push([rr,cc]);
        else if(S.ep&&S.ep[0]===rr&&S.ep[1]===cc)m.push([rr,cc,"ep"]);}
      return m;
    }
  }
  return[];
}

/* ---------- applying moves ---------- */
function capture(r,c,why){
  const t=S.board[r][c];if(!t)return;
  fxBurst(r,c,t.c==="w"?"#fff":"#ff3fb4",28);
  if(t.t==="k"){S.winner=opp(t.c);log(`${NAME.k} on ${sqName(r,c)} captured${why?" ("+why+")":""}!`);}
  S.board[r][c]=null;
}
function doMove(fr,fc,tr,tc,flag,opts={}){
  const p=S.board[fr][fc];
  const cap=!!S.board[tr][tc]||flag==="ep";
  let txt=`${p.c==="w"?"White":"Black"} ${NAME[p.t]} ${sqName(fr,fc)}→${sqName(tr,tc)}`;
  if(S.board[tr][tc])capture(tr,tc);
  if(flag==="ep"){capture(fr,tc);}
  S.board[tr][tc]=p;S.board[fr][fc]=null;ANIM.push({r:tr,c:tc,kind:opts.anim||"slide",from:[fr,fc]});
  if(flag==="castle"){const right=tc>fc;const rc=right?7:0,nc=right?tc-1:tc+1;S.board[tr][nc]=S.board[tr][rc];S.board[tr][rc]=null;ANIM.push({r:tr,c:nc,kind:"slide",from:[tr,rc]});S.board[tr][nc].moved=true;txt+=" (castle)";}
  S.ep=null;
  if(p.t==="p"&&Math.abs(tr-fr)===2&&!opts.spell)S.ep=[(fr+tr)/2,fc];
  if(p.t==="p"&&(tr===0||tr===7)){p.t="q";txt+=" =Queen";}
  p.moved=true;
  lastMove=[[fr,fc],[tr,tc]];
  if(opts.tag)txt=opts.tag+": "+txt;
  log(txt+(cap?" ×":""));
  sfx(cap?"cap":"move");
  fxRing(tr,tc,cap?"#ff3fb4":"#ffd84a");
}
function endTurn(){
  const mover=S.turn;
  // bombs tick each turn
  for(const bm of S.bombs){bm.t--;}
  const boom=S.bombs.filter(b=>b.t<=0);S.bombs=S.bombs.filter(b=>b.t>0);
  for(const bm of boom){for(const[r,c]of bm.sq){fxBurst(r,c,"#ffb03f",40);capture(r,c,"Pengu Blast");}pop("BOOM!",bm.sq[0][0],bm.sq[0][1]);sfx("boom");shake(14);flashScreen("#ffb03f");log("Pengu Blast detonated!");}
  for(const row of S.board)for(const p of row){if(!p)continue;
    if(p.c===mover&&p.stun>0)p.stun--;            // stun ends after its owner's turn
    if(p.hid&&p.c!==mover)p.hid=0;                // invisible until opponent's turn ends
  }
  if(!$("freeTurn").checked){
    S.turn=opp(mover);
    if(S.skip[S.turn]){S.skip[S.turn]=false;log(`${S.turn==="w"?"White":"Black"} skips the turn (Plasma Beam).`);S.turn=mover;}
    if(!$("infMana").checked)S.mana[S.turn]=Math.min(10,S.mana[S.turn]+1);
  }
}

const enemy=(r,c,f)=>{const p=at(r,c);return p&&p.c!==S.turn&&(!f||f(p));};

function wrapMoves(r,c){ // Transcendence: moves that cross the a/h edge once
  const p=S.board[r][c],col=p.c,out=[];
  const add=(rr,cc)=>{const t=S.board[rr][cc];if(!t)return 1;if(t.c!==col&&t.t!=="k")out.push([rr,cc]);return 0;};
  if(p.t==="n"){for(const[dr,dc]of D_N){const rr=r+dr,cc=c+dc;if(rr<0||rr>7||(cc>=0&&cc<8))continue;const w=(cc+8)%8;if(add(rr,w))out.push([rr,w]);}return out;}
  if(p.t==="p"){const d=col==="w"?-1:1;for(const dc of[-1,1]){const cc=c+dc;if(cc>=0&&cc<8)continue;const w=(cc+8)%8,rr=r+d;if(inB(rr,w)){const t=S.board[rr][w];if(t&&t.c!==col&&t.t!=="k")out.push([rr,w]);}}return out;}
  const dirs=p.t==="b"?D_B:p.t==="r"?D_R:D_Q;
  const slide=p.t!=="k";
  for(const[dr,dc]of dirs){if(dc===0)continue;
    let rr=r,cc=c,wrapped=false;
    for(let i=0;i<8;i++){
      rr+=dr;cc+=dc;
      if(cc<0||cc>7){if(wrapped)break;wrapped=true;cc=(cc+8)%8;}
      if(rr<0||rr>7||(rr===r&&cc===c))break;
      const t=S.board[rr][cc];
      if(t){if(wrapped&&t.c!==col&&t.t!=="k")out.push([rr,cc]);break;}
      if(wrapped)out.push([rr,cc]);
      if(!slide)break;
    }
  }
  return out;
}
function hopMoves(r,c){ // Bis-Hop 2.0: leap over exactly one piece
  const col=S.board[r][c].c,out=[];
  for(const[dr,dc]of D_B){let rr=r+dr,cc=c+dc,jumped=false;
    while(inB(rr,cc)){const t=S.board[rr][cc];
      if(t){if(!jumped){jumped=true;}else{if(t.c!==col)out.push([rr,cc]);break;}}
      else if(jumped)out.push([rr,cc]);
      rr+=dr;cc+=dc;}
  }
  return out;
}
function connected(list){if(list.length<2)return true;const seen=[list[0]],q=[list[0]];
  while(q.length){const a=q.pop();for(const b of list)if(!seen.includes(b)&&Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])===1){seen.push(b);q.push(b);}}
  return seen.length===list.length;}

function steal(){const o=opp(S.turn);if(S.mana[o]>0){S.mana[o]--;S.mana[S.turn]++;}}
const costOf=sp=>sp.id==="pi"?S.piCost[S.turn]:sp.cost;

function startSpell(sp){
  if(S.winner||busy)return;
  if(!$("infMana").checked&&S.mana[S.turn]<costOf(sp)){flash(`Not enough mana for ${sp.n}.`);return;}
  cancel();spell=sp;spellSel=[];
  targets=sp.steps[0](spellSel);
  if(!targets.length){flash(`No valid target for ${sp.n}.`);spell=null;render();return;}
  showBanner(sp);render();
}
function spellClick(r,c){
  if(!targets.some(t=>t[0]===r&&t[1]===c))return;
  spellSel.push([r,c]);
  if(spell.multi){
    if(spellSel.length>=spell.multi)return finishSpell();
    targets=spell.steps[0](spellSel);render();return;
  }
  if(spellSel.length<spell.steps.length){
    targets=spell.steps[spellSel.length](spellSel);
    if(!targets.length){flash("No valid target. Cancelled.");cancel();}
    render();return;
  }
  finishSpell();
}
function finishSpell(){
  if(busy)return;

  const sp=spell,sq=spellSel.slice();
  if(!$("infMana").checked)S.mana[S.turn]-=costOf(sp);
  log(`✦ ${S.turn==="w"?"White":"Black"} casts ${sp.n}`);
  targets=[];busy=true;render();
  castIntro(sp,sq[sq.length-1],()=>{
    const ends=sp.run(sq);
    spell=null;spellSel=[];targets=[];busy=false;
    if(ends)endTurn();
    render();
  });
}

/* ---------- input ---------- */
function onSquare(r,c,right){
  if(busy)return;
  if(spell&&!right)return spellClick(r,c);
  if(mode==="create"){
    save();
    if(right){S.board[r][c]=null;render();return;}
    if(palettePick){S.board[r][c]=palettePick==="x"?null:mk(palettePick[1],palettePick[0]);render();return;}
    hist.pop();
    if(sel){const p=at(...sel);if(!(sel[0]===r&&sel[1]===c)){save();S.board[r][c]=p;S.board[sel[0]][sel[1]]=null;ANIM.push({r,c,kind:"slide",from:sel});lastMove=[sel,[r,c]];sfx("move");}sel=null;render();return;}
    if(at(r,c)){sel=[r,c];render();}
    return;
  }
  if(right){cancel();render();return;}
  if(S.winner)return;
  if(spell)return spellClick(r,c);
  const p=at(r,c);
  if(sel){
    const m=targets.find(t=>t[0]===r&&t[1]===c);
    if(m){save();doMove(sel[0],sel[1],r,c,m[2]);sel=null;targets=[];endTurn();render();return;}
  }
  const free=$("freeTurn").checked;
  if(p&&(free||p.c===S.turn)){
    if(free)S.turn=p.c;
    sel=[r,c];targets=moves(r,c);if(p.stun)flash("That piece is stunned.");
  }else{sel=null;targets=[];}
  render();
}

    const d=document.createElement("div");d.className="sq";d.dataset.sq=r+"_"+c;
    if(lastMove.some(s=>s[0]===r&&s[1]===c))d.classList.add("last");
    if(sel&&sel[0]===r&&sel[1]===c)d.classList.add("sel");

    const tg=targets.find(t=>t[0]===r&&t[1]===c);
    if(tg){if(spell)d.classList.add("spt");else{d.classList.add("tgt");if(S.board[r][c]||tg[2]==="ep")d.classList.add("cap");}}

/* ---------- piece animations ---------- */
function runAnims(){
  const list=ANIM;ANIM=[];
  const sz=$("board").clientWidth/8;
  const vis=(r,c)=>[flipped?7-c:c,flipped?7-r:r];
  for(const a of list){
    const el=document.querySelector(`[data-sq="${a.r}_${a.c}"] .pc`);if(!el)continue;
    let dx=0,dy=0;if(a.from){const[x1,y1]=vis(...a.from),[x2,y2]=vis(a.r,a.c);dx=(x1-x2)*sz;dy=(y1-y2)*sz;}
    const T=(x,y,s=1,e="")=>`translate(${x}px,${y}px) scale(${s}) ${e}`;
    let kf,o={duration:260,easing:"cubic-bezier(.2,.8,.2,1)"};
    switch(a.kind){
      case"slide":kf=[{transform:T(dx,dy)},{transform:T(0,0)}];break;
      case"dash":kf=[{transform:T(dx,dy),filter:"brightness(2) drop-shadow(0 0 12px #fff)"},{transform:T(0,0),filter:"none"}];o.duration=200;break;
      case"hop":kf=[{transform:T(dx,dy)},{transform:T(dx/2,dy/2-sz*1.2,1.35),offset:.5},{transform:T(0,0,1)}];o.duration=520;o.easing="ease-in-out";break;
      case"teleport":kf=[{transform:T(0,0,0,"rotate(-180deg)"),opacity:0},{transform:T(0,0,1.3),opacity:1,offset:.7},{transform:T(0,0,1)}];o.duration=520;break;
      case"wrap":{const side=dx>0?-1:1;kf=[{transform:T(side*sz*1.2,dy),opacity:0,filter:"hue-rotate(90deg) brightness(2)"},{transform:T(0,0),opacity:1,filter:"none"}];o.duration=600;break;}
      case"summon":kf=[{transform:T(0,0,0,"rotate(360deg)"),opacity:0},{transform:T(0,0,1.4),opacity:1,offset:.7},{transform:T(0,0,1)}];o.duration=700;break;
      case"rise":kf=[{transform:T(0,sz*.6,1),opacity:0,clipPath:"inset(0 0 100% 0)"},{transform:T(0,0,1),opacity:1,clipPath:"inset(0 0 0 0)"}];o.duration=650;break;
      case"morph":kf=[{transform:T(0,0,1,"rotateY(0deg)"),filter:"brightness(1)"},{transform:T(0,0,1.3,"rotateY(540deg)"),filter:"brightness(3)",offset:.6},{transform:T(0,0,1,"rotateY(720deg)"),filter:"brightness(1)"}];o.duration=800;break;
      case"shock":kf=[{transform:T(-4,0)},{transform:T(4,0)},{transform:T(-3,0)},{transform:T(3,0)},{transform:T(0,0)}];o.duration=400;o.iterations=2;break;
      case"vanish":kf=[{opacity:1,filter:"brightness(1)"},{opacity:0,filter:"brightness(0) blur(4px)",offset:.5},{opacity:.35,filter:"grayscale(1)"}];o.duration=900;break;
    }
    if(kf)el.animate(kf,o);
  }
}

function fxBurst(r,c,col,n){const[x,y,s]=sqXY(r,c);for(let i=0;i<n;i++){const a=rnd(0,6.28),v=rnd(1,5)*s/60;add({t:0,life:rnd(40,70),draw(t){const k=1-t/this.life;cx.globalAlpha=k;cx.fillStyle=col;cx.beginPath();cx.arc(x+Math.cos(a)*v*t*(1-t/this.life/2),y+Math.sin(a)*v*t*(1-t/this.life/2),s/40*k+1,0,7);cx.fill();}});}}

function fxSpiral(r,c,col){const[x,y,s]=sqXY(r,c);for(let i=0;i<40;i++){const a0=rnd(0,6.28),R=rnd(.8,1.8)*s;add({t:0,life:50,draw(t){const k=t/this.life,rr=R*(1-k),a=a0+k*8;cx.globalAlpha=1-k*.6;cx.fillStyle=i%2?col:"#fff";cx.beginPath();cx.arc(x+Math.cos(a)*rr,y+Math.sin(a)*rr,s/30,0,7);cx.fill();}});}}

function fxSmoke(r,c){const[x,y,s]=sqXY(r,c);for(let i=0;i<26;i++){const a=rnd(0,6.28),v=rnd(.2,1)*s/40,R=rnd(.15,.35)*s;add({t:0,life:rnd(50,80),draw(t){const k=t/this.life;cx.globalAlpha=(1-k)*.7;cx.globalCompositeOperation="source-over";cx.fillStyle=i%3?"#2a1f45":"#6b4fa8";cx.beginPath();cx.arc(x+Math.cos(a)*v*t,y+Math.sin(a)*v*t-k*s*.4,R*(1+k),0,7);cx.fill();cx.globalCompositeOperation="lighter";}});}}

let AC;function sfx(k){if(!$("sound").checked)return;AC=AC||new AudioContext();const t=AC.currentTime;
  const tock=(d,f,v)=>{const o=AC.createOscillator(),g=AC.createGain(),bq=AC.createBiquadFilter();o.type="triangle";o.frequency.setValueAtTime(f,t+d);o.frequency.exponentialRampToValueAtTime(f*.5,t+d+.08);
    bq.type="bandpass";bq.frequency.value=f*2;g.gain.setValueAtTime(v,t+d);g.gain.exponentialRampToValueAtTime(.001,t+d+.12);o.connect(bq).connect(g).connect(AC.destination);o.start(t+d);o.stop(t+d+.15);};
  const noise=(dur,f,v,sweep)=>{const n=AC.createBufferSource(),b=AC.createBuffer(1,AC.sampleRate*dur,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);
    n.buffer=b;const fl=AC.createBiquadFilter();fl.type="lowpass";fl.frequency.setValueAtTime(f,t);if(sweep)fl.frequency.exponentialRampToValueAtTime(sweep,t+dur);const g=AC.createGain();g.gain.value=v;n.connect(fl).connect(g).connect(AC.destination);n.start(t);};
  if(k==="move")tock(0,420,.6);
  if(k==="cap"){tock(0,500,.7);tock(.06,380,.6);}
  if(k==="boom")noise(.9,900,1,60);
  if(k==="beam")noise(.6,300,.7,6000);
  if(k==="magic"){for(let i=0;i<5;i++){const o=AC.createOscillator(),g=AC.createGain();o.type="sine";o.frequency.value=660*Math.pow(1.26,i);g.gain.setValueAtTime(.12,t+i*.05);g.gain.exponentialRampToValueAtTime(.001,t+i*.05+.3);o.connect(g).connect(AC.destination);o.start(t+i*.05);o.stop(t+i*.05+.35);}}
}

function buildPalette(){
  const P=$("palette");P.innerHTML="";
  for(const c of"wb")for(const t of"kqrbnp"){const b=document.createElement("div");b.className="pp";b.dataset.p=c+t;b.title=(c==="w"?"White ":"Black ")+NAME[t];b.appendChild(pieceEl(c,t));b.firstChild.className="";P.appendChild(b);}
  const x=document.createElement("div");x.className="pp erase";x.dataset.p="x";x.textContent="✕ ERASER";P.appendChild(x);
  P.querySelectorAll(".pp").forEach(el=>{el.classList.toggle("on",el.dataset.p===palettePick);el.onclick=()=>{palettePick=palettePick===el.dataset.p?null:el.dataset.p;sel=null;buildPalette();};});
}
function setMode(m){mode=m;cancel();palettePick=null;sel=null;targets=[];
  document.querySelectorAll("#modeSw button").forEach(b=>b.classList.toggle("on",b.dataset.mode===m));
  $("createPanel").style.display=m==="create"?"":"none";
  if(m==="play"){S.winner=null;S.ep=null;}
  render();}
function buildUI(){
  $("spells").innerHTML=SPELLS.map(s=>`<button class="tile" data-id="${s.id}" title="${s.n}: ${s.d}"><div class="im" style="background-image:url('skins/spells/${s.id}.png')"><span class="diamond"><b>${s.cost}</b></span></div><span class="nm">${s.n}</span></button>`).join("");
  document.querySelectorAll(".tile").forEach(el=>{const sp=SPELLS.find(s=>s.id===el.dataset.id);
    el.onclick=()=>{if(spell===sp){cancel();render();}else startSpell(sp);};
    el.onmouseenter=()=>{hoverSp=sp;if(!spell)drawCard();};
    el.onmouseleave=()=>{hoverSp=null;if(!spell)drawCard();};});
  document.querySelectorAll("#modeSw button").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
  $("flip").onclick=()=>{flipped=!flipped;render();};
  $("undo").onclick=undo;
  $("pass").onclick=()=>{save();cancel();S.turn=opp(S.turn);sel=null;targets=[];render();};
  $("cancelBtn").onclick=()=>{cancel();render();};
  $("reset").onclick=()=>{save();S=newState();lastMove=[];cancel();render();};
  $("clear").onclick=()=>{save();S.board=Array.from({length:8},()=>Array(8).fill(null));S.bombs=[];S.winner=null;render();};
  $("startPos").onclick=()=>{save();S.board=startBoard();S.bombs=[];S.winner=null;render();};
  document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{const c=b.dataset.m[0],op=b.dataset.m[1];S.mana[c]=Math.max(0,S.mana[c]+(op==="+"?1:-1));render();});
  ["infMana","freeTurn"].forEach(id=>$(id).onchange=render);
  $("coordsT").onchange=e=>document.body.classList.toggle("coords-on",e.target.checked);
  document.querySelectorAll(".cosRow").forEach(r=>r.onclick=()=>openModal(r.dataset.tab));
  document.querySelectorAll(".mtabs [data-tab]").forEach(b=>b.onclick=()=>{mTab=b.dataset.tab;drawModal();});
  $("mClose").onclick=()=>$("modal").classList.remove("show");
  $("modal").onclick=e=>{if(e.target.id==="modal")$("modal").classList.remove("show");};
  $("mAll").onclick=()=>{const k=COS[mTab];if(k&&k!=="none"){COS.board=k;COS.pieces=k;COS.bg=SKINS[k][1]?k:"none";applyCos();drawModal();}};
  $("focusBtn").onclick=()=>{document.body.classList.toggle("focus");render();};
  addEventListener("keydown",e=>{
    if(e.target.tagName==="SELECT")return;
    if(e.key==="Escape"){if($("modal").classList.contains("show"))$("modal").classList.remove("show");else{cancel();render();}}
    if(e.key==="z"&&e.ctrlKey)undo();
    if(e.key==="f")$("flip").click();
    if(e.key==="h")$("focusBtn").click();
  });
  addEventListener("resize",()=>render());
}
S=newState();buildUI();applyCos();
</script>
</body></html>
